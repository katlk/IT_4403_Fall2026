        <h1>Home</h1>

        <script>

            //fetching the data and converting to JSON
            fetch("https://openlibrary.org/dev/docs/api/search?utm_source=chatgpt.com")
            .then(response => {
                if(!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();

                })
                .then(data => {
                    console.log('Fetched data:', data);
                    displayData(data);
                })
                .catch(error => {
                    console.error('Error fetching JSON:', error);
                    document.getElementById('output').textContent = 'Failed to load data';

                output += "</ul>";

            $(document).ready(function() {

                if (query) {
                    $('#searchResult').text('Searching for: ' + query);

            //Pagination

            function showPage(page) {
                $(".item").hide().slice((page - 1) * pageSize, page * pageSize).show();
            }
            showPage(1);

            $("#pagination li a").click(function(e) {

                $("#pagination li a").removeClass("active")
                showPage(parseInt($(this).text()));

                $.ajax({
