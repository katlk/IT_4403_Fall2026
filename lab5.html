<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="site.css">
        <script src="https://code.jquery.com/jquery-3.7.1.js"
            integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
            crossorigin="anonymous">
        </script>

    </head>

    <body>
        <!--Used https://www.xjavascript.com/blog/json-javascript-jquery-how-to-import-data-from-a-json-file-and-parse-it/#step-1-prepare-your-json-file for help.-->


 

        <h1>Open Library: Data Analysis Books</h1>
        <div id="results"></div>

               <script>
            fetch('https://openlibrary.org/search.json?q=data%20analysis&limit=10')
                .then(response => {
                    if(!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();

                })
                .then(data => {
                    console.log(data.docs);
                    displayData(data.docs);
                })
                .catch(error => {
                    console.error('Error fetching JSON:', error);
                    document.getElementById("results").textContent = 'Failed to load data';

                });
            
            function displayData(docs) {
                const resultsDiv = document.getElementById("results");
                let output = "<ul>";

                for (let i = 0; i <docs.length; i++) {
                    const book = docs[i];
                    const year = book.first_publish_year ? book.first_publish_year : "Year unavailable";
                    output += `<li>${book.title} (${year})</li>`;
                }

                output += "</ul>";
                resultsDiv.innerHTML = output;
            }

        </script>


    </body>
</html>
